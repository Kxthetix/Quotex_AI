# Trading Intelligence System — Feature Configuration v1.0.0
version: "v1.0.0"
base_timeframe: "1m"

# Price Features (Returns, Body, Wicks, Range, Gap)
price:
  returns_periods:
    - 1
    - 3
    - 5
    - 15
    - 30
    - 60
  log_returns_periods:
    - 1
    - 5
    - 15
  include_candle_body: true
  include_wicks: true
  include_range: true
  include_gap: true

# Trend Features (EMA, SMA, ADX, Slopes, HH/LL)
trend:
  ema_periods:
    - 9
    - 20
    - 50
    - 100
    - 200
  sma_periods:
    - 20
    - 50
    - 100
    - 200
  adx_period: 14
  slope_periods:
    - 10
    - 20
  structure_lookback: 20

# Momentum Features (RSI, MACD, ROC, Stochastic)
momentum:
  rsi_periods:
    - 7
    - 14
    - 21
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  roc_periods:
    - 9
    - 14
    - 21
  stoch_k_period: 14
  stoch_d_period: 3
  stoch_smooth_k: 3

# Volatility Features (ATR, Rolling Volatility, Historical Volatility)
volatility:
  atr_periods:
    - 7
    - 14
  rolling_vol_periods:
    - 10
    - 20
    - 30
  historical_vol_periods:
    - 20
    - 60

# Volume Features (Relative Volume, Moving Averages, Spikes, Trends)
volume:
  relative_vol_periods:
    - 10
    - 20
    - 50
  volume_ma_periods:
    - 20
    - 50
  volume_spike_threshold: 2.0
  volume_trend_periods:
    - 10
    - 20

# Market Structure Features (Support/Resistance, Breakout, Retest, Consolidation)
structure:
  support_resistance_lookback: 20
  breakout_lookback: 20
  consolidation_lookback: 20
  consolidation_threshold: 0.02

# Multi-Timeframe Alignment
multi_timeframe:
  enabled: true
  enabled_timeframes:
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"
  higher_tf_ema_periods:
    - 20
    - 50
  higher_tf_rsi_period: 14
  higher_tf_atr_period: 14
